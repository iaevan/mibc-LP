name: Deploy campaign backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/campaigns/**'
      - 'campaign-migrations/**'
      - 'wrangler.campaigns.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/campaign-deploy.yml'
concurrency:
  group: campaign-backend-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CAMPAIGNS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_CAMPAIGNS_API_TOKEN repository secret. It needs Workers Scripts Edit and D1 Edit in the campaign account."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run test:campaigns
      - run: node scripts/campaigns.mjs migrate
      - run: npx wrangler deploy --config wrangler.campaigns.jsonc
